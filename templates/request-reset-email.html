<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оновлення даних облікового запису</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f7f9;
      font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
    "
  >
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td style="padding: 40px 0">
          <table
            align="center"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            "
          >
            <tr>
              <td
                align="center"
                style="padding: 30px 40px; background-color: {{color}}; border-radius: 8px 8px 0 0;"
              >
                <h1 style="color: #000; margin: 0; font-size: 24px">
                  Оновлення даних
                </h1>
              </td>
            </tr>

            <tr>
              <td style="padding: 40px">
                <p
                  style="
                    font-size: 16px;
                    color: #333333;
                    line-height: 1.5;
                    margin-bottom: 20px;
                  "
                >
                  Вітаємо, <strong>{{name}}</strong>!
                </p>
                <p
                  style="
                    font-size: 16px;
                    color: #555555;
                    line-height: 1.5;
                    margin-bottom: 25px;
                  "
                >
                  Ми отримали запит на оновлення даних вашого облікового запису.
                  Щоб підтвердити ці зміни, натисніть кнопку нижче:
                </p>

                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td align="center">
                      <a
                        href="{{link}}"
                        target="_blank"
                        style="background-color: {{color}}; color: #000; padding: 14px 30px; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 5px; display: inline-block;"
                      >
                        Підтвердити зміни
                      </a>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    font-size: 14px;
                    color: #888888;
                    line-height: 1.5;
                    margin-top: 30px;
                  "
                >
                  Це посилання дійсне протягом <strong>15 хвилин</strong>.
                </p>
                <p style="font-size: 14px; color: #888888; line-height: 1.5">
                  Якщо ви не робили цього запиту, просто проігноруйте лист.
                </p>
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 20px 40px;
                  background-color: #f9fafb;
                  border-radius: 0 0 8px 8px;
                  border-top: 1px solid #eeeeee;
                  text-align: center;
                "
              >
                <p style="font-size: 12px; color: #aaaaaa; margin: 0">
                  &copy; 2026 Leleka.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
